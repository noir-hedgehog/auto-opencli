name: Trigger Website Rebuild (Docs Updated)

on:
  push:
    branches: [main]
    paths: ['docs/**', '.github/workflows/docs.yml']

jobs:
  dispatch:
    # Only the upstream project deploys jackwener/opencli-website.
    if: github.repository == 'jackwener/opencli'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger opencli-website rebuild
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.WEBSITE_DEPLOY_TOKEN }}
          repository: jackwener/opencli-website
          event-type: docs-updated
